[tools]
go = "1.27.3"
resvg = "0.48.1"
oxipng = "10.2.1"

[tasks.generate-icons]
description = "Generate Lucide PNG icons for the interface"
run = "bash internal/ui/assets/icons/generate-icons.sh"

[tasks.generate-app-icon]
description = "Render high-resolution app icons from the SVG source"
run = """
set -eu
resvg --width 1024 --height 1024 logo/paw.svg internal/icon/paw.png
oxipng --opt 2 --strip safe --nb --nc internal/icon/paw.png
cp internal/icon/paw.png logo/paw.png
resvg --width 1024 --height 1024 logo/paw-macos.svg logo/paw-macos.png
oxipng --opt 2 --strip safe --nb --nc logo/paw-macos.png
"""

[tasks.licenses]
description = "Generate third-party license notices from the Go module"
run = "go tool lian --dump --excluded github.com/fyne-io/gomobile-bridge@v0.1.0 -o THIRD_PARTY_LICENSES go.mod"

[tasks.setup]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.run]
description = "Run Paw from source"
run = "go run ."

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.lint]
description = "Run Go static checks"
run = ["go vet ./...", "go tool staticcheck ./..."]

[tasks.vuln]
description = "Check Go dependencies and packages for known vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.screenshots]
description = "Capture, optimize, and package the UI screenshot gallery"
run = """
set -eu
repo_dir="$PWD"
tmp_dir="$(mktemp -d "${TMPDIR:-/tmp}/paw-screenshots.XXXXXX")"
archive_tmp="${TMPDIR:-/tmp}/paw-screenshots-archive-$$.zip"
trap 'rm -rf "$tmp_dir" "$archive_tmp"' EXIT
mkdir -p "$tmp_dir/gallery"
PAW_UI_SNAPSHOT_DIR="$tmp_dir/gallery" go test ./internal/ui -run '^TestUIE2EScreenshotGallery$' -count=1
oxipng --opt 2 --strip safe --nb --nc --quiet --recursive "$tmp_dir/gallery"
cd "$tmp_dir"
zip -q -X -r "$archive_tmp" gallery
mv "$archive_tmp" "$repo_dir/screenshots.zip"
zip -T "$repo_dir/screenshots.zip"
printf 'Created %s/screenshots.zip\n' "$repo_dir"
"""

[tasks.test-race]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks.build]
description = "Build the Paw application"
run = "mkdir -p dist && go build -trimpath -o dist/paw ."

[tasks.check]
description = "Run formatting, analysis, tests, vulnerability check, and build"
depends = ["fmt", "lint", "vuln", "test", "build"]
