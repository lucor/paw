name: Build packages and release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    name: Verify tag passed CI on main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          }

      - name: Verify successful CI run for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\")] | length")

          if [[ "$successful_runs" -eq 0 ]]; then
            echo "No successful CI run on main found for $GITHUB_SHA" >&2
            exit 1
          fi

  package-linux:
    name: Package Linux / ${{ matrix.arch }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          check-latest: true

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Build Linux package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release
          mv Paw.tar.xz "Paw_${PACKAGE_VERSION}_linux_${GOARCH}.tar.xz"

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Paw-linux-${{ matrix.arch }}
          path: dist/Paw_*.tar.xz
          if-no-files-found: error

  package-windows:
    name: Package Windows / amd64
    needs: verify-ci
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          check-latest: true

      - name: Check Windows C compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          test "$(go env CGO_ENABLED)" = "1"

      - name: Download Go dependencies
        run: go mod download

      - name: Build Windows package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release

      - name: Name Windows executable
        shell: pwsh
        run: Move-Item Paw.exe "dist/Paw_${env:PACKAGE_VERSION}_windows_${env:GOARCH}.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Paw-windows-amd64
          path: dist/Paw_*.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS / ${{ matrix.arch }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          check-latest: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build macOS package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release

      - name: Create macOS disk image
        run: |
          codesign --force --deep --sign - dist/Paw.app
          codesign --verify --deep --strict dist/Paw.app
          mkdir -p dist/dmg
          cp -R dist/Paw.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Paw -srcfolder dist/dmg -ov -format UDZO \
            "dist/Paw_${PACKAGE_VERSION}_darwin_${GOARCH}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Paw-macos-${{ matrix.arch }}
          path: dist/Paw_*.dmg
          if-no-files-found: error

  package-freebsd:
    name: Package FreeBSD / ${{ matrix.go_arch }} in fyne-cross image
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_arch: amd64
            go_arch: amd64
            target: x86_64-unknown-freebsd12
            cgo_ldflags: ''
          - image_arch: arm64
            go_arch: arm64
            target: aarch64-unknown-freebsd12
            cgo_ldflags: -fuse-ld=lld
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GO_VERSION: '1.26.9'
      FYNE_CROSS_IMAGES_VERSION: v1.3.2
      GOOS: freebsd
      GOARCH: ${{ matrix.go_arch }}
      CGO_ENABLED: '1'
      CC: clang --sysroot=/freebsd --target=${{ matrix.target }}
      CXX: clang++ --sysroot=/freebsd --target=${{ matrix.target }}
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build package with fyne-cross image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            --env PACKAGE_VERSION \
            --env GOOS \
            --env GOARCH \
            --env CGO_ENABLED \
            --env "GOTOOLCHAIN=go$GO_VERSION" \
            --env CC \
            --env CXX \
            --env CGO_LDFLAGS \
            "fyneio/fyne-cross-images:${FYNE_CROSS_IMAGES_VERSION}-freebsd-${{ matrix.image_arch }}" \
            sh -euc '
            go version
            clang --version
            go mod download
            mkdir -p dist
            cd dist
            fyne package \
              --source-dir .. --name Paw --app-id dev.lucor.paw \
              --icon logo/paw.png --app-version "$PACKAGE_VERSION" \
              --tags x11,migrated_fynedo --release
            mv Paw.tar.xz "Paw_${PACKAGE_VERSION}_freebsd_${GOARCH}.tar.xz"
            '

      - name: Upload FreeBSD package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Paw-freebsd-${{ matrix.go_arch }}
          path: dist/Paw_*.tar.xz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package-linux, package-windows, package-macos, package-freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/paw-release-assets
          merge-multiple: true

      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
