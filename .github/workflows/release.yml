name: Build packages and release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    name: Verify tag passed CI on main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          }

      - name: Verify successful CI run for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\")] | length")

          if [[ "$successful_runs" -eq 0 ]]; then
            echo "No successful CI run on main found for $GITHUB_SHA" >&2
            exit 1
          fi

  package-linux:
    name: Package Linux / ${{ matrix.arch }} (Debian Bookworm)
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Install Linux graphics dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Build Linux package
        run: |
          export GOFLAGS="-ldflags=-X=go.lucor.dev/paw/internal/paw.BuildVersion=v$PACKAGE_VERSION"
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release
          mv Paw.tar.xz "Paw_${PACKAGE_VERSION}_linux_${GOARCH}.tar.xz"

      - name: Upload Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paw-linux-${{ matrix.arch }}
          path: dist/Paw_*.tar.xz
          if-no-files-found: error

  package-windows:
    name: Package Windows / amd64
    needs: verify-ci
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Check Windows C compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          test "$(go env CGO_ENABLED)" = "1"

      - name: Download Go dependencies
        run: go mod download

      - name: Build Windows package
        run: |
          export GOFLAGS="-ldflags=-X=go.lucor.dev/paw/internal/paw.BuildVersion=v$PACKAGE_VERSION"
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release

      - name: Name Windows executable
        shell: pwsh
        run: Move-Item Paw.exe "dist/Paw_${env:PACKAGE_VERSION}_windows_${env:GOARCH}.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paw-windows-amd64
          path: dist/Paw_*.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS / ${{ matrix.arch }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build macOS package
        run: |
          export GOFLAGS="-ldflags=-X=go.lucor.dev/paw/internal/paw.BuildVersion=v$PACKAGE_VERSION"
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name Paw \
            --app-id dev.lucor.paw --icon logo/paw-macos.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release

      - name: Create macOS disk image
        run: |
          codesign --force --deep --sign - dist/Paw.app
          codesign --verify --deep --strict dist/Paw.app
          mkdir -p dist/dmg
          cp -R dist/Paw.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Paw -srcfolder dist/dmg -ov -format UDZO \
            "dist/Paw_${PACKAGE_VERSION}_darwin_${GOARCH}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paw-macos-${{ matrix.arch }}
          path: dist/Paw_*.dmg
          if-no-files-found: error

  package-freebsd:
    name: Package FreeBSD / ${{ matrix.go_arch }} in fyne-cross image
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_arch: amd64
            go_arch: amd64
            target: x86_64-unknown-freebsd12
            cgo_ldflags: ''
          - image_arch: arm64
            go_arch: arm64
            target: aarch64-unknown-freebsd12
            cgo_ldflags: -fuse-ld=lld
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GO_VERSION: '1.27.4'
      FYNE_CROSS_IMAGES_VERSION: v1.3.2
      GOOS: freebsd
      GOARCH: ${{ matrix.go_arch }}
      CGO_ENABLED: '1'
      CC: clang --sysroot=/freebsd --target=${{ matrix.target }}
      CXX: clang++ --sysroot=/freebsd --target=${{ matrix.target }}
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build package with fyne-cross image
        run: |
          export PAW_GOFLAGS="-ldflags=-X=go.lucor.dev/paw/internal/paw.BuildVersion=v$PACKAGE_VERSION"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            --env PACKAGE_VERSION \
            --env GOFLAGS="$PAW_GOFLAGS" \
            --env GOOS \
            --env GOARCH \
            --env CGO_ENABLED \
            --env "GOTOOLCHAIN=go$GO_VERSION" \
            --env CC \
            --env CXX \
            --env CGO_LDFLAGS \
            "fyneio/fyne-cross-images:${FYNE_CROSS_IMAGES_VERSION}-freebsd-${{ matrix.image_arch }}" \
            sh -euc '
            go version
            clang --version
            go mod download
            mkdir -p dist
            cd dist
            fyne package \
              --source-dir .. --name Paw --app-id dev.lucor.paw \
              --icon logo/paw.png --app-version "$PACKAGE_VERSION" \
              --tags x11,migrated_fynedo --release
            mv Paw.tar.xz "Paw_${PACKAGE_VERSION}_freebsd_${GOARCH}.tar.xz"
            '

      - name: Upload FreeBSD package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paw-freebsd-${{ matrix.go_arch }}
          path: dist/Paw_*.tar.xz
          if-no-files-found: error

  package-android:
    name: Package Android / arm64
    needs: verify-ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '30.0.16248370'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Configure Java and Android SDK
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          dirname "$sdkmanager" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Download Go dependencies
        run: go mod download

      - name: Build Android APK
        run: |
          export GOFLAGS="-ldflags=-X=go.lucor.dev/paw/internal/paw.BuildVersion=v$PACKAGE_VERSION"
          mkdir -p dist
          go tool fyne package --os android/arm64 --name Paw \
            --app-id dev.lucor.paw --icon logo/paw.png \
            --app-version "$PACKAGE_VERSION" --tags migrated_fynedo --release
          mv Paw.apk "dist/Paw_${PACKAGE_VERSION}_android_arm64.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paw-android-arm64
          path: dist/Paw_*_android_arm64.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package-linux, package-windows, package-macos, package-freebsd, package-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/paw-release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd /tmp/paw-release-assets
          shasum -a 256 Paw_* > checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --clobber /tmp/paw-release-assets/*
